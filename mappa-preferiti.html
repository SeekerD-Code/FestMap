<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FestMap - Mappa Preferiti</title>


    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A148C">

    <!-- Fogli di stile -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style-menu.css">
    <link rel="stylesheet" href="css/style-pc.css" media="(min-width: 768px)">
    <link rel="stylesheet" href="css/map/style-map-menu.css">
    <link rel="stylesheet" href="css/map/style-map.css">

    <link rel="stylesheet" href="css/mobile/style-mobile.css">
    <link rel="stylesheet" href="css/mobile/style-mobile-menu.css">
    <link rel="stylesheet" href="css/mobile/style-mobile-map-menu.css">
    <link rel="stylesheet" href="css/mobile/style-mobile-map.css">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <!-- Leaflet CSS via CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="map-page" style="margin: 0; overflow: hidden;">

    <!-- Contenitore principale per l'header e il drawer -->
    <div id="app">
        <!-- HEADER FISSO -->
        <header class="app-header" style="position: relative; z-index: 1000;">
            <button id="menu-toggle-btn" class="icon-btn" aria-label="Menu">
                <span>☰</span>
            </button>

            <nav class="bottom-nav inline-nav-links">
                <a href="index.html" class="nav-item">
                    <img src="images/logo FM.png" alt="Logo" class="home-logo">
                    <span>Home</span>
                </a>
                <a href="map.html" class="nav-item">
                    <span class="nav-icon">🗺️</span>
                    <span class="nav-label">Mappa</span>
                </a>
                <a href="calendario.html" class="nav-item">
                    <span class="nav-icon">📅</span>
                    <span class="nav-label">Calendario</span>
                </a>
                <a href="preferiti.html" class="nav-item active">
                    <span class="nav-icon">❤️</span>
                    <span class="nav-label">Preferiti</span>
                </a>
            </nav>

            <div class="header-right-space"></div>

            <!-- Contatore Eventi Visualizzati -->
            <div id="event-counter-badge" style="position: absolute; right: 15px; top: 12px; background: rgba(0, 0, 0, 0.06); padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; color: #444; display: inline-block;">
                Eventi: <span id="counter-value">0</span>
            </div>
        </header>

        <!-- MENU LATERALE (DRAWER) -->
        <nav id="side-drawer" class="drawer">
            <div class="drawer-header">
                <h3>Menu</h3>
                <button id="drawer-close-btn">&times;</button>
            </div>
            <ul class="drawer-links">
                <li><a href="eventi/wild.html">Wild Festivals</a></li>
                <li><a href="eventi/comics.html">Comics & Cosplay</a></li>
                <li><a href="eventi/food.html">Food & Good</a></li>
                <li><a href="eventi/folk.html">Folklore & Tradizioni</a></li>
                <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
                <li><a href="contatti.html" style="font-weight: bold !important; color: #ff6b6b !important; text-decoration: underline !important;">Segnala un Evento & Contatti</a></li>                <li><a href="faq.html">FAQ</a></li>
                <li><a href="privacy.html">Privacy & Note Legali</a></li>
            </ul>
        </nav>
        <div id="drawer-backdrop" class="backdrop"></div>
    </div>

    <!-- Contenitore Mappa Fullscreen (sotto l'header) -->

    <div id="map"></div>

    <!-- Leaflet JS via CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Logica della mappa preferiti e gestione UI -->
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/map-preferiti.js"></script>
</body>
</html>
